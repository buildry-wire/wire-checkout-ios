name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & test
        run: |
          swift build -v
          swift test -v

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
